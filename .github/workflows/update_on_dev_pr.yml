name: Update Commit Info on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
    paths:
      - 'pipeline/workflows/synthetic_data_bank.yml'
      - 'src/syntheticdatabank/01_Generate_Structured_Data.ipynb'
      - 'src/syntheticdatabank/02_Generate_Unstructured_Data.ipynb'
      - 'src/syntheticdatabank/Synthetic_Data_CMDB.ipynb'
      - 'src/syntheticdatabank/Synthetic_Update_Descriptions.ipynb'

jobs:
  update-commit-info:
    # Only run for PRs from the same repository to prevent fork-based attacks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Get latest commit info
        id: commit_info
        run: |
          COMMIT_ID=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)

          # Use multiline output format to prevent injection
          {
            echo "commit_id=$COMMIT_ID"
            echo "commit_msg<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update notebook with commit info
        env:
          COMMIT_ID: ${{ steps.commit_info.outputs.commit_id }}
          COMMIT_MSG: ${{ steps.commit_info.outputs.commit_msg }}
        run: |
          python3 << 'EOF'
          import json
          import os

          notebook_path = 'src/syntheticdatabank/Synthetic_Check_Commit_Info.ipynb'

          # Safely get environment variables
          commit_id = os.environ.get("COMMIT_ID", "")
          commit_msg = os.environ.get("COMMIT_MSG", "")

          # Properly escape strings for Python/JSON
          def escape_string(s):
              return s.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r')

          with open(notebook_path, 'r', encoding='utf-8') as f:
              notebook = json.load(f)

          updated = False

          for cell in notebook.get("cells", []):
              source_text = "".join(cell.get("source", []))

              if "COMMIT_ID" in source_text or "COMMIT_MSG" in source_text:
                  cell["source"] = [
                      f'COMMIT_ID = "{escape_string(commit_id)}"\n',
                      f'COMMIT_MSG = "{escape_string(commit_msg)}"\n'
                  ]
                  updated = True
                  break

          if not updated:
              raise RuntimeError(
                  "No cell containing COMMIT_ID / COMMIT_MSG found in Synthetic_Check_Commit_Info.ipynb"
              )

          with open(notebook_path, 'w', encoding='utf-8') as f:
              json.dump(notebook, f, indent=1, ensure_ascii=False)
              f.write("\n")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/syntheticdatabank/Synthetic_Check_Commit_Info.ipynb

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update COMMIT_ID and COMMIT_MSG in Synthetic_Check_Commit_Info.ipynb"
          git push