name: Update Commit Info on Change

on:
  push:
    branches:
      - '**'   # ✅ ANY branch
    paths:
      - 'pipeline/workflows/synthetic_data_bank.yml'
      - 'src/syntheticdatabank/01_Generate_Structured_Data.ipynb'
      - 'src/syntheticdatabank/02_Generate_Unstructured_Data.ipynb'
      - 'src/syntheticdatabank/Synthetic_Data_CMDB.ipynb'
      - 'src/syntheticdatabank/Synthetic_Update_Descriptions.ipynb'

jobs:
  update-commit-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          cd $(basename "${{ github.repository }}")
          git checkout ${{ github.ref_name }}

      - name: Get triggering commit info
        id: commit_info
        working-directory: ${{ github.event.repository.name }}
        run: |
          COMMIT_ID=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_DATETIME=$(git log -1 --pretty=%cI)

          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_datetime=$COMMIT_DATETIME" >> $GITHUB_OUTPUT

      - name: Update notebook with commit info
        working-directory: ${{ github.event.repository.name }}
        env:
          COMMIT_ID: ${{ steps.commit_info.outputs.commit_id }}
          COMMIT_MSG: ${{ steps.commit_info.outputs.commit_msg }}
          COMMIT_DATETIME: ${{ steps.commit_info.outputs.commit_datetime }}
        run: |
          python3 << 'EOF'
          import json, os

          notebook_path = 'src/syntheticdatabank/Synthetic_Data_On_Merge.ipynb'

          with open(notebook_path, 'r', encoding='utf-8') as f:
              notebook = json.load(f)

          for cell in notebook.get('cells', []):
              source = ''.join(cell.get('source', []))
              if 'commit_id =' in source:
                  cell['source'] = [
                      f'commit_id = "{os.environ["COMMIT_ID"]}"\n',
                      f'commit_msg = "{os.environ["COMMIT_MSG"].replace(chr(34), r"\\\"")}"\n',
                      f'commit_datetime = "{os.environ["COMMIT_DATETIME"]}"\n'
                  ]
                  break

          with open(notebook_path, 'w', encoding='utf-8') as f:
              json.dump(notebook, f, indent=1, ensure_ascii=False)
              f.write('\n')
          EOF

      - name: Commit and push changes
        working-directory: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/syntheticdatabank/Synthetic_Data_On_Merge.ipynb
          git commit -m "Auto-update commit info based on file change" || exit 0
          git push